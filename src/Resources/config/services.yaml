services:
    _defaults:
        autowire: true
        autoconfigure: false

    React\EventLoop\LoopInterface:
        factory: ['React\EventLoop\Loop', 'get']

    SymfonyProcessManager\Command\ServeCommand:
        tags: ['console.command']

    SymfonyProcessManager\Worker\WorkerProcessFactoryInterface: '@SymfonyProcessManager\Worker\WorkerProcessFactory'
    SymfonyProcessManager\Worker\WorkerProcessFactory: ~
    SymfonyProcessManager\Output\WorkerOutputFormatter: ~
    SymfonyProcessManager\Output\WorkerOutputHandler: ~
    SymfonyProcessManager\Ipc\IpcCodec: ~
    SymfonyProcessManager\Ipc\IpcEndpoint: ~
    SymfonyProcessManager\Ipc\IpcFanout: ~
    SymfonyProcessManager\Ipc\WorkerContextInterface: '@SymfonyProcessManager\Ipc\WorkerContext'
    SymfonyProcessManager\Ipc\WorkerContext: ~
    SymfonyProcessManager\Worker\WorkerIpcSubscriber:
        tags: ['kernel.event_subscriber']
    SymfonyProcessManager\Http\HttpServer: ~

    SymfonyProcessManager\Metrics\PrometheusRendererInterface: '@SymfonyProcessManager\Metrics\PrometheusTextRenderer'
    SymfonyProcessManager\Metrics\PrometheusTextRenderer: ~

    SymfonyProcessManager\Metrics\MetricFactoryInterface: '@SymfonyProcessManager\Metrics\MetricFactory'
    SymfonyProcessManager\Metrics\MetricFactory: ~
    SymfonyProcessManager\Metrics\MetricsRegistry: ~

    SymfonyProcessManager\ProcessManager\ShutdownState: ~
    SymfonyProcessManager\ProcessManager\ProcessManagerLoop: ~
    SymfonyProcessManager\ProcessManager\Orchestrator: ~

    SymfonyProcessManager\Autoscaler\Strategy\StrategyRegistry: ~
    SymfonyProcessManager\Autoscaler\AutoscalerLoop: ~
    SymfonyProcessManager\Autoscaler\Arbiter\PriorityArbiter: ~
