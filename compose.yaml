services:
  app:
    image: symfony-process-manager
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    working_dir: /app
    volumes:
      - ./:/app:cached
      - vendor:/app/vendor
      - ${HOME}/.composer/cache:/home/app/.composer/cache:cached
    environment:
      PM_HTTP_HOST: 0.0.0.0
      PM_HTTP_PORT: 9100
    ports:
      - "${PM_HOST_PORT:-0}:9100"
    init: true
    command:
      - bash
      - -lc
      - |
          php tests/Fixtures/app/bin/console messenger:setup-transports --no-interaction
          exec php tests/Fixtures/app/bin/console pm:serve

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_HOST_PORT:-0}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    ports:
      - "${GRAFANA_HOST_PORT:-0}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/process-manager.json
    depends_on:
      - prometheus

volumes:
  vendor:
