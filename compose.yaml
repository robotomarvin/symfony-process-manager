services:
  pm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    working_dir: /app
    volumes:
      - ./:/app:cached
      - vendor:/app/vendor
    environment:
      PM_HTTP_HOST: 0.0.0.0
      PM_HTTP_PORT: 9100
    ports:
      - "${PM_HOST_PORT:-9100}:9100"
    command:
      - bash
      - -lc
      - |
          if [ ! -f vendor/autoload.php ]; then
            composer install
          fi
          php tests/Fixtures/app/bin/console messenger:setup-transports --no-interaction
          php tests/Fixtures/app/bin/console pm:serve

  test:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    working_dir: /app
    volumes:
      - ./:/app:cached
      - vendor:/app/vendor
    command:
      - bash
      - -lc
      - |
          if [ ! -f vendor/autoload.php ]; then
            composer install
          fi
          ./vendor/bin/phpunit

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - pm

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  vendor:
