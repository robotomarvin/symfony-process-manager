services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    working_dir: /app
    volumes:
      - ./:/app:cached
      # Optional: keep vendor/ in a named Docker volume.
      # This avoids writing ./vendor to the host and can improve performance on macOS.
      # - vendor:/app/vendor
    ports:
      - "9100:9100"
    tty: true
    stdin_open: true

volumes:
  vendor:
